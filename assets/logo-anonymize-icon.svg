<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Símbolo ANONYMIZE">
  <defs>
    <linearGradient id="anm-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1D38" />
      <stop offset="100%" stop-color="#060D1A" />
    </linearGradient>
    <linearGradient id="anm-border" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="anm-bar" x1="16" y1="36" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Escudo geométrico arredondado -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#anm-bg)" stroke="url(#anm-border)" stroke-width="2.5" />

  <!-- Monograma A estrutural (hastes laterais) -->
  <path
    d="M32 13L16.5 49H23.2L32 27.6L40.8 49H47.5L32 13Z"
    fill="#F8FAFC"
  />

  <!-- Barra de Tarjamento Irreversível (substitui o traço interno do A) -->
  <rect x="17" y="34.5" width="30" height="7" rx="3.5" fill="url(#anm-bar)" />

  <!-- Micro-corte de precisão / auditoria dentro da tarja -->
  <rect x="22.5" y="37" width="11" height="2" rx="1" fill="#060D1A" opacity="0.72" />
  <circle cx="40.5" cy="38" r="1.4" fill="#060D1A" opacity="0.72" />
</svg>
